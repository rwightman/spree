[project]
name = "bbs-gym"
version = "0.1.0"
description = "BBS and door-game environments for LLM terminal agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "tty-agent==0.1.0",
]

[project.urls]
Homepage = "https://github.com/rwightman/spree"
Documentation = "https://github.com/rwightman/spree#readme"
Repository = "https://github.com/rwightman/spree"
Issues = "https://github.com/rwightman/spree/issues"

[project.scripts]
bbs-gym = "bbs_gym.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bbs_gym*"]
