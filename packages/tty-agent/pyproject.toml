[project]
name = "tty-agent"
version = "0.1.1"
description = "Terminal-agent runtime for LLM-driven interactive TTY sessions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyte>=0.8.2",
]

[project.urls]
Homepage = "https://github.com/rwightman/spree"
Documentation = "https://github.com/rwightman/spree#readme"
Repository = "https://github.com/rwightman/spree"
Issues = "https://github.com/rwightman/spree/issues"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tty_agent*"]
