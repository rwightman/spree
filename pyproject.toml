[tool.uv.workspace]
members = [
    "packages/tty-agent",
    "packages/bbs-gym",
]

[tool.uv.sources]
tty-agent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/tty-agent/src",
    "packages/bbs-gym/src",
]
