# Synchronet DOS-door overrides for DOSEMU2.
# DOSEMU2 removed the legacy DOSDRIVE_D mapping used by Synchronet. Its
# hdimage parser still expands environment variables, so map the active node
# as D:, reserve E:-H: for Synchronet, and move DOSEMU's utility drives later.
$_hdimage = "+0 ", $DOSDRIVE_D, " -4 +1"
$_lredir_paths = "/sbbs /sbbs-data"
$_cpu = "80486"
$_cpu_vm = "emulated"
$_cpu_vm_dpmi = "emulated"
# Keep a per-process DOS clock that launchers can set without changing the host.
$_timemode = "bios"
$_floppy_a = ""
$_xms = (4096)
$_ems = (4096)
$_ems_frame = (0xe000)
$_external_char_set = "cp437"
$_internal_char_set = "cp437"
$_layout = "us"
$_rawkeyboard = (auto)
$_mouse_internal = (on)
$_mouse_dev = ""
$_joy_device = ""
$_lpt1 = ""
$_speaker = ""
$_sound = (off)
